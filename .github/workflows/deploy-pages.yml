name: Deploy A350 schematic to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/a350-3d-schematic-uzyzfd
    paths:
      - a350-1000-schematic/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: a350-1000-schematic
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
