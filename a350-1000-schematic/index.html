<style>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }

<script type="module">
import * as THREE from 'three';

/* ============================================================
   Airbus A350-1000 — procedural 3D schematic
   Aircraft coordinates: +z aft (nose at z=0, tail z=73.8),
   +y up, +x starboard (right). Units: metres.
   ============================================================ */

const LEN = 73.8;            // overall fuselage length
const R   = 2.98;            // max fuselage radius
const GROUND_Y = -5.7;       // ground plane (gives ~2.7 m belly clearance)

// ---------- renderer / scene ----------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1118);
scene.fog = new THREE.Fog(0x0d1118, 130, 380);

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.05, 600);

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0x9fb8d8, 0x1a2028, 0.85));
const sun = new THREE.DirectionalLight(0xfff2e0, 2.2);
sun.position.set(45, 60, -35);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60;  sun.shadow.camera.bottom = -60;
sun.shadow.camera.far = 220;
sun.shadow.bias = -0.0004;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x4db8d8, 0.7);
rim.position.set(-50, 25, 60);
scene.add(rim);

// cabin lights so the interior is visible when flying through
for (const z of [-22, -2, 18]) {
  const pl = new THREE.PointLight(0xfff4e2, 14, 22, 1.8);
  pl.position.set(0, 1.6, z);
  scene.add(pl);
}

// ---------- ground: hangar apron + grid ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(260, 64),
  new THREE.MeshStandardMaterial({ color: 0x141a22, roughness: 0.95, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = GROUND_Y;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(240, 60, 0x23404d, 0x1a2530);
grid.position.y = GROUND_Y + 0.02;
scene.add(grid);

// ---------- materials ----------
const BA_BLUE = '#0b2d6b', BA_RED = '#e0252a';
const MAT = {
  skin:    new THREE.MeshStandardMaterial({ color: 0xf2f4f6, roughness: 0.4, metalness: 0.1, side: THREE.DoubleSide }),
  navy:    new THREE.MeshStandardMaterial({ color: 0x12306e, roughness: 0.45, metalness: 0.15, side: THREE.DoubleSide }),
  belly:   new THREE.MeshStandardMaterial({ color: 0xb9c2ca, roughness: 0.5, metalness: 0.1 }),
  wing:    new THREE.MeshStandardMaterial({ color: 0xdfe5ea, roughness: 0.45, metalness: 0.12, side: THREE.DoubleSide }),
  mask:    new THREE.MeshStandardMaterial({ color: 0x14181d, roughness: 0.15, metalness: 0.5, side: THREE.DoubleSide }),
  nacelle: new THREE.MeshStandardMaterial({ color: 0x122f6b, roughness: 0.4, metalness: 0.2, side: THREE.DoubleSide }),
  lip:     new THREE.MeshStandardMaterial({ color: 0xb8bec4, roughness: 0.2, metalness: 0.9, side: THREE.DoubleSide }),
  metal:   new THREE.MeshStandardMaterial({ color: 0x8f969d, roughness: 0.3, metalness: 0.95, side: THREE.DoubleSide }),
  dark:    new THREE.MeshStandardMaterial({ color: 0x1c2127, roughness: 0.6, metalness: 0.3 }),
  frame:   new THREE.MeshStandardMaterial({ color: 0x4d7d96, roughness: 0.6, metalness: 0.4, transparent: true, opacity: 0.85 }),
  spar:    new THREE.MeshStandardMaterial({ color: 0x9a6a3c, roughness: 0.6, metalness: 0.4, transparent: true, opacity: 0.9 }),
  tire:    new THREE.MeshStandardMaterial({ color: 0x16181b, roughness: 0.95 }),
  hub:     new THREE.MeshStandardMaterial({ color: 0xc6ccd2, roughness: 0.3, metalness: 0.8 }),
  strut:   new THREE.MeshStandardMaterial({ color: 0xa9b1b8, roughness: 0.35, metalness: 0.85 }),
  cabin:   new THREE.MeshStandardMaterial({ color: 0xd8dde2, roughness: 0.85 }),
  floorM:  new THREE.MeshStandardMaterial({ color: 0x3a4250, roughness: 0.9 }),
  seatEco: new THREE.MeshStandardMaterial({ color: 0x27415f, roughness: 0.85 }),
  seatBiz: new THREE.MeshStandardMaterial({ color: 0x47352a, roughness: 0.8 }),
  podBiz:  new THREE.MeshStandardMaterial({ color: 0x8d9197, roughness: 0.6 }),
  glow:    new THREE.MeshStandardMaterial({ color: 0xfff6e0, emissive: 0xfff0d0, emissiveIntensity: 1.4, roughness: 1 }),
  glass:   new THREE.MeshStandardMaterial({ color: 0x0c1014, roughness: 0.05, metalness: 0.6 }),
  panel:   new THREE.MeshStandardMaterial({ color: 0x23282e, roughness: 0.5 }),
};
const xrayTargets = [
  { m: MAT.skin, op: 0.13 }, { m: MAT.navy, op: 0.13 }, { m: MAT.belly, op: 0.13 },
  { m: MAT.wing, op: 0.2 }, { m: MAT.nacelle, op: 0.25 }, { m: MAT.mask, op: 0.3 },
];

// ---------- shared helpers ----------
const aircraft = new THREE.Group();
aircraft.position.set(0, 0, -LEN / 2); // recentre so the model straddles the world origin
scene.add(aircraft);

function shadows(obj) {
  obj.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return obj;
}

// fuselage radius along z
function fuseR(z) {
  if (z < 7)  { const t = Math.max(z, 0) / 7; return R * Math.pow(Math.sin(t * Math.PI / 2), 0.72); }
  if (z <= 58) return R;
  const t = Math.min((z - 58) / (LEN - 58), 1);
  return R * (1 - 0.92 * Math.pow(t, 1.6));
}
// nose droop + tail upsweep applied to centreline
function fuseDY(z) {
  let dy = 0;
  if (z < 8)  dy -= 1.05 * Math.pow((8 - z) / 8, 1.9);
  if (z > 59) dy += 2.25 * Math.pow((z - 59) / (LEN - 59), 1.7);
  return dy;
}
function applyFuselageShape(geom) {
  const p = geom.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, p.getY(i) + fuseDY(p.getZ(i)));
  geom.computeVertexNormals();
  return geom;
}
// a lathe-built fuselage slice from z0..z1 (full or partial circumference)
function fuselageSection(z0, z1, mat, { phiStart = 0, phiLength = Math.PI * 2, rOff = 0, steps = 26 } = {}) {
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const z = z0 + (z1 - z0) * i / steps;
    pts.push(new THREE.Vector2(Math.max(fuseR(z) + rOff, 0.001), z));
  }
  const g = new THREE.LatheGeometry(pts, 48, phiStart, phiLength);
  g.rotateX(Math.PI / 2);          // lathe axis y -> z
  applyFuselageShape(g);
  return new THREE.Mesh(g, mat);
}

// NACA-style airfoil outline: closed loop, u in [0,1] chordwise, v = half thickness (for t/c = 1)
function airfoilProfile(samples = 22, camber = 0.018) {
  const half = x => 5 * (0.2969 * Math.sqrt(x) - 0.126 * x - 0.3516 * x * x + 0.2843 * x ** 3 - 0.1036 * x ** 4) / 10;
  const cam = x => camber * 4 * x * (1 - x);
  const pts = [];
  for (let i = 0; i <= samples; i++) { const x = 1 - i / samples; pts.push([x, cam(x) + half(x)]); }  // TE -> LE over top
  for (let i = 1; i < samples; i++)  { const x = i / samples;     pts.push([x, cam(x) - half(x)]); }  // LE -> TE under bottom
  return pts;
}
const FOIL = airfoilProfile();
const FOIL_SYM = airfoilProfile(22, 0);

// loft an airfoil through a list of stations -> BufferGeometry
// station: { pos:Vector3, chord, thick (t/c ratio), bank (rad about +z) }
function loftWing(stations, profile, flip = false) {
  const n = profile.length, verts = [], idx = [];
  const chordAxis = new THREE.Vector3(0, 0, 1);
  for (const st of stations) {
    const q = new THREE.Quaternion().setFromAxisAngle(chordAxis, st.bank || 0);
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(q);
    for (const [u, v] of profile) {
      const p = st.pos.clone()
        .addScaledVector(chordAxis, (u - 0.35) * st.chord)
        .addScaledVector(up, v * st.thick * 10 * st.chord);
      verts.push(p.x, p.y, p.z);
    }
  }
  const quad = (a, d, c, b) => flip ? idx.push(a, c, d, a, b, c) : idx.push(a, d, c, a, c, b);
  for (let i = 0; i < stations.length - 1; i++)
    for (let j = 0; j < n; j++) {
      const a = i * n + j, b = i * n + (j + 1) % n;
      quad(a, a + n, b + n, b);
    }
  // tip cap (fan)
  const tip0 = (stations.length - 1) * n, c = new THREE.Vector3();
  for (let j = 0; j < n; j++) c.add(new THREE.Vector3(verts[(tip0 + j) * 3], verts[(tip0 + j) * 3 + 1], verts[(tip0 + j) * 3 + 2]));
  c.divideScalar(n);
  const ci = verts.length / 3; verts.push(c.x, c.y, c.z);
  for (let j = 0; j < n; j++) {
    const a = tip0 + j, b = tip0 + (j + 1) % n;
    flip ? idx.push(ci, b, a) : idx.push(ci, a, b);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

// ============================================================
// PART REGISTRY — every part flies in from `from` offset
// ============================================================
const parts = [];
const P = {};   // parts by key — assembly stages reference these in build order
function part(key, group, from) {
  group.userData.home = group.position.clone();
  group.userData.from = from.clone();
  group.userData.spin = (Math.random() - 0.5) * 0.5;
  group.visible = false;
  aircraft.add(group);
  parts.push(group);
  P[key] = group;
  return group;
}

// ------------------------------------------------------------
// 1. Keel beam + cabin floor structure
// ------------------------------------------------------------
const structure = new THREE.Group();
{
  const keel = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.5, 60), MAT.spar);
  keel.position.set(0, -2.25, 36); structure.add(keel);
  const floorBeam = new THREE.BoxGeometry(5.1, 0.16, 0.22);
  for (let z = 7; z <= 65; z += 2.9) {
    const b = new THREE.Mesh(floorBeam, MAT.frame);
    b.position.set(0, -0.72, z); structure.add(b);
  }
  const rail = new THREE.BoxGeometry(0.12, 0.1, 58);
  for (const x of [-2.2, -0.75, 0.75, 2.2]) {
    const r = new THREE.Mesh(rail, MAT.frame); r.position.set(x, -0.62, 36); structure.add(r);
  }
}
part('structure', shadows(structure), V3(0, -26, 0));

// ------------------------------------------------------------
// 2. Fuselage frames (the schematic rib cage)
// ------------------------------------------------------------
const frames = new THREE.Group();
for (let z = 4; z <= 70; z += 3.3) {
  const r = fuseR(z) - 0.07;
  if (r < 0.35) continue;
  const t = new THREE.Mesh(new THREE.TorusGeometry(r, 0.055, 8, 56), MAT.frame);
  t.position.set(0, fuseDY(z), z);
  frames.add(t);
}
// crown stringer
const stringer = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 62), MAT.frame);
stringer.position.set(0, R - 0.12, 36); frames.add(stringer);
part('frames', shadows(frames), V3(0, 30, 0));

// ------------------------------------------------------------
// 3–7. Fuselage skin: five barrels, each split into a white upper
// shell and a BA dark-blue lower shell so the skin visibly wraps
// (clamshells closing) around the structure and interior.
// ------------------------------------------------------------
// After the lathe's rotateX, a vertex sits at (r sinφ, -r cosφ, z):
// φ=0 is the belly, φ=π the crown. The seam angle puts the white/navy
// split ~1 m below the centreline.
const SEAM = Math.acos(1.0 / R);
function barrelHalves(key, z0, z1, fromAbove = 16, fromBelow = 11) {
  const upper = new THREE.Group();
  upper.add(fuselageSection(z0, z1, MAT.skin, { phiStart: SEAM, phiLength: 2 * Math.PI - 2 * SEAM }));
  const lower = new THREE.Group();
  lower.add(fuselageSection(z0, z1, MAT.skin, { phiStart: -SEAM, phiLength: 2 * SEAM }));
  part(key + 'U', shadows(upper), V3(0, fromAbove, 0));
  part(key + 'L', shadows(lower), V3(0, -fromBelow, 0));
  return { upper, lower };
}

const nose = barrelHalves('nose', 0.001, 7);
{ // cockpit windscreen "mask" — the A350 signature
  const mask = fuselageSection(4.35, 6.05, MAT.mask, { rOff: 0.035, phiStart: Math.PI * 0.72, phiLength: Math.PI * 0.56, steps: 10 });
  nose.upper.add(mask);
  const radome = fuselageSection(0.001, 1.6, MAT.belly, { rOff: 0.02, steps: 10 });
  nose.upper.add(radome);
}
barrelHalves('fwd', 7, 26);
const center = barrelHalves('ctr', 26, 44);
{ // belly fairing rises with the lower shell
  const bf = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 24), MAT.navy);
  bf.scale.set(3.35, 2.45, 11.6); bf.position.set(0, -1.55, 36.5);
  bf.castShadow = true; center.lower.add(bf);
}
barrelHalves('aft', 44, 58);
const tail = barrelHalves('tail', 58, LEN - 0.05);
{ // APU exhaust
  const apu = new THREE.Mesh(new THREE.ConeGeometry(0.26, 1.4, 20), MAT.metal);
  apu.rotation.x = Math.PI / 2;
  apu.position.set(0, fuseDY(LEN) + 0.05, LEN + 0.45);
  tail.upper.add(apu);
}

// ------------------------------------------------------------
// 8. Wing spars (schematic structure, per side)
// ------------------------------------------------------------
function sparBox(rootPos, tipPos, h) {
  const dir = tipPos.clone().sub(rootPos);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.BoxGeometry(len, h, 0.32), MAT.spar);
  m.position.copy(rootPos).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(V3(1, 0, 0), dir.normalize());
  return m;
}
const AFT = V3(0, 0, 1);
const spars = new THREE.Group();
for (const s of [1, -1]) {
  const sts = wingStations(s).slice(0, 8); // main wing only, winglet excluded
  for (const frac of [0.14, 0.62]) {       // front & rear spar chord fractions
    for (let i = 0; i < sts.length - 1; i++) {
      const a = sts[i], b = sts[i + 1];
      const pa = a.pos.clone().addScaledVector(AFT, (frac - 0.35) * a.chord);
      const pb = b.pos.clone().addScaledVector(AFT, (frac - 0.35) * b.chord);
      const h = Math.min(a.thick * a.chord, b.thick * b.chord) * 0.6;
      spars.add(sparBox(pa, pb, h));
    }
  }
  for (let i = 1; i < 8; i++) { // ribs between the spars
    const st = sts[i];
    const zf = st.pos.z + (0.14 - 0.35) * st.chord, zr = st.pos.z + (0.62 - 0.35) * st.chord;
    const rib = new THREE.Mesh(new THREE.BoxGeometry(0.12, st.thick * st.chord * 0.55, zr - zf), MAT.frame);
    rib.position.set(st.pos.x, st.pos.y, (zf + zr) / 2);
    spars.add(rib);
  }
}
// centre wing box
const cwb = new THREE.Mesh(new THREE.BoxGeometry(5.6, 1.3, 6.4), MAT.spar);
cwb.position.set(0, -1.15, 34.2); spars.add(cwb);
part('spars', shadows(spars), V3(0, -22, 0));

// ------------------------------------------------------------
// 9. Wings (with blended winglets) — lofted
// ------------------------------------------------------------
function wingStations(s) { // s = +1 right, -1 left
  return [
    { pos: V3(2.4 * s, -1.18, 34.6), chord: 11.2, thick: 0.13, bank: 0 },
    { pos: V3(6.5 * s, -0.85, 36.6), chord: 8.4,  thick: 0.12, bank: 0 },
    { pos: V3(11.3 * s, -0.45, 39.2), chord: 6.5, thick: 0.11, bank: 0 },
    { pos: V3(16.0 * s, -0.05, 41.8), chord: 5.2, thick: 0.105, bank: 0 },
    { pos: V3(20.6 * s, 0.38, 44.4),  chord: 4.2, thick: 0.10, bank: 0 },
    { pos: V3(25.2 * s, 0.85, 47.0),  chord: 3.3, thick: 0.095, bank: 0 },
    { pos: V3(28.9 * s, 1.32, 49.1),  chord: 2.6, thick: 0.09, bank: 0.10 * s },
    { pos: V3(30.6 * s, 1.72, 50.2),  chord: 2.1, thick: 0.09, bank: 0.42 * s },
    { pos: V3(31.7 * s, 2.45, 51.0),  chord: 1.55, thick: 0.085, bank: 0.95 * s },
    { pos: V3(32.2 * s, 3.45, 51.6),  chord: 1.05, thick: 0.08, bank: 1.30 * s },
  ];
}
function buildWing(s) {
  const grp = new THREE.Group();
  const mesh = new THREE.Mesh(loftWing(wingStations(s), FOIL, s < 0), MAT.wing);
  grp.add(mesh);
  // flap-track fairings
  for (const [x, z, l] of [[5.5, 40.7, 3.4], [9.8, 42.4, 3.0], [14.6, 44.6, 2.6], [19.6, 46.9, 2.2]]) {
    const f = new THREE.Mesh(new THREE.CapsuleGeometry(0.17, l, 4, 10), MAT.belly);
    f.rotation.x = Math.PI / 2;
    const t = (x - 2.6) / 29.6;
    f.position.set(x * s, -1.15 + 2.4 * t - 0.32, z + l * 0.25);
    grp.add(f);
  }
  // nav light at tip
  const nav = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8),
    new THREE.MeshStandardMaterial({ color: s > 0 ? 0x18e85a : 0xff3030, emissive: s > 0 ? 0x18e85a : 0xff3030, emissiveIntensity: 2.5 }));
  nav.position.set(31.9 * s, 2.1, 50.6);
  grp.add(nav);
  return shadows(grp);
}

// navy belly paint: white under the nose, full-depth from the wing aft,
// sweeping up the rear fuselage like the real Chatham Dockyard scheme
function bellyHalfWidth(z) {
  if (z < 10) return 0;
  if (z < 26) { const t = (z - 10) / 16; return SEAM * t * t * (3 - 2 * t); }
  if (z < 52) return SEAM;
  return SEAM + (1.9 - SEAM) * Math.pow((z - 52) / 21.5, 1.2);
}
function bellyBand() {
  const Z0 = 10, Z1 = 73.4, NZ = 64, NP = 26;
  const verts = [], idx = [];
  for (let i = 0; i <= NZ; i++) {
    const z = Z0 + (Z1 - Z0) * i / NZ;
    const w = Math.max(bellyHalfWidth(z), 0.02);
    const r = fuseR(z) + 0.018, dy = fuseDY(z);
    for (let j = 0; j <= NP; j++) {
      const phi = -w + 2 * w * j / NP;
      verts.push(r * Math.sin(phi), -r * Math.cos(phi) + dy, z);
    }
  }
  for (let i = 0; i < NZ; i++)
    for (let j = 0; j < NP; j++) {
      const a = i * (NP + 1) + j, b = a + NP + 1;
      idx.push(a, b, b + 1, a, b + 1, a + 1);
    }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return new THREE.Mesh(g, MAT.navy);
}

}
function makeNoseFlagTexture() {
  // red-over-navy Union flag ribbon worn on the nose crown behind the cockpit
  const c = document.createElement('canvas'); c.width = 512; c.height = 320;
  const x = c.getContext('2d');
  x.lineCap = 'round';
  const ribbon = (w, color, dy) => {
    x.strokeStyle = color; x.lineWidth = w;
    x.beginPath();
    x.moveTo(488, 250 + dy);
    x.quadraticCurveTo(260, 230 + dy, 30, 90 + dy);
    x.stroke();
  };
  ribbon(96, BA_BLUE, 52);
  ribbon(26, '#f4f6f8', 18);
  ribbon(60, BA_RED, -28);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 8;
  return t;
}
function makeTailTexture() {
  // Chatham Dockyard Union Flag: red ribbon with white borders sweeping
  // up and aft across the navy fin
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const x = c.getContext('2d');
  x.lineCap = 'round';
  // canvas u=1 maps toward the nose on the starboard side (port side is
  // re-mirrored with scale.x), so bottom-right -> top-left sweeps up-and-aft
  const ribbon = (w, color) => {
    x.strokeStyle = color; x.lineWidth = w;
    x.beginPath();
    x.moveTo(482, 460);
    x.quadraticCurveTo(272, 380, 42, 70);
    x.stroke();
  };
  ribbon(150, '#f4f6f8');
  ribbon(78, BA_RED);
  // thin white accent ribbon below
  x.strokeStyle = '#f4f6f8'; x.lineWidth = 16;
  x.beginPath(); x.moveTo(452, 510); x.quadraticCurveTo(232, 440, 12, 150); x.stroke();
  const t = new THREE.CanvasTexture(c); t.anisotropy = 8;

  { label: 'Tail cone & APU', parts: [P.tailU, P.tailL], dur: 2.0 },
  { label: 'Wings & blended winglets', parts: [P.wingL, P.wingR], dur: 3.0 },
  { label: 'Vertical stabiliser', parts: [P.fin], dur: 2.2 },
  { label: 'Horizontal stabilisers', parts: [P.hstab], dur: 2.0 },
  { label: 'Engine pylons', parts: [P.pylons], dur: 1.8 },
  { label: 'Trent XWB-97 engines', parts: [P.engL, P.engR], dur: 2.8 },
  { label: 'Landing gear — 6-wheel bogies', parts: [P.gear], dur: 2.4 },
  { label: 'Windows, doors & livery', parts: [P.details], dur: 2.4 },
];
const TOTAL_STAGES = STAGES.length;

const ui = {
  label: document.getElementById('stageLabel'),
  count: document.getElementById('stageCount'),
  bar: document.getElementById('barFill'),
  fly: document.getElementById('flyPrompt'),
  speedo: document.getElementById('speedo'),
  speedVal: document.getElementById('speedVal'),
  crosshair: document.getElementById('crosshair'),
};

let mode = 'assembling';     // 'assembling' | 'done'
let stageIdx = 0, stageT = 0;
const GAP = 0.35;            // pause between stages

const easeOut = t => 1 - Math.pow(1 - t, 3);

function setPartProgress(p, k) {
  p.visible = k > 0;
  const e = easeOut(Math.min(Math.max(k, 0), 1));
  p.position.copy(p.userData.home).addScaledVector(p.userData.from, 1 - e);
  p.rotation.y = p.userData.spin * (1 - e);
}

function finishAssembly() {
  for (const p of parts) setPartProgress(p, 1);
  stageIdx = TOTAL_STAGES;
  mode = 'done';
  ui.label.textContent = 'A350-1000 G-XWBA — ASSEMBLY COMPLETE';
  ui.count.textContent = 'BRITISH AIRWAYS · WINGSPAN 64.75 M · LENGTH 73.79 M · MTOW 322 T';
  ui.bar.style.width = '100%';
  ui.fly.style.opacity = 1;
  setTimeout(() => { ui.fly.style.opacity = 0; }, 6000);
}
function replayAssembly() {
  for (const p of parts) setPartProgress(p, 0);
  stageIdx = 0; stageT = -0.5; mode = 'assembling';
  ui.fly.style.opacity = 0;
  orbit.angle = -0.8;
}

function tickAssembly(dt) {
  if (stageIdx >= TOTAL_STAGES) return;
  const st = STAGES[stageIdx];
  stageT += dt;
  ui.label.textContent = st.label.toUpperCase();
  ui.count.textContent = `STAGE ${stageIdx + 1} / ${TOTAL_STAGES}`;
  ui.bar.style.width = `${((stageIdx + Math.min(stageT / st.dur, 1)) / TOTAL_STAGES) * 100}%`;
  st.parts.forEach((p, i) => setPartProgress(p, (stageT - i * 0.25) / st.dur));
  if (stageT >= st.dur + GAP) {
    for (const p of st.parts) setPartProgress(p, 1);
    stageIdx++; stageT = 0;
    if (stageIdx >= TOTAL_STAGES) finishAssembly();
  }
}

// ============================================================
// CAMERA — auto/manual orbit + pointer-lock fly mode
// ============================================================
const orbit = { angle: -0.8, height: 14, radius: 72, target: new THREE.Vector3(0, 0, 0), auto: true };
let flying = false;
let yaw = 0, pitch = 0;
const vel = new THREE.Vector3();
let flySpeed = 7;
const keys = {};

function stageFocus() {
  // aim the orbit camera at the active stage's parts
  if (mode !== 'assembling' || stageIdx >= TOTAL_STAGES) return new THREE.Vector3(0, 0, 0);
  const st = STAGES[stageIdx];
  const f = new THREE.Vector3();
  for (const p of st.parts) f.add(p.userData.home);
  f.divideScalar(st.parts.length).add(aircraft.position);
  f.multiplyScalar(0.45); // bias toward model centre so framing stays wide
  return f;
}

function updateOrbit(dt) {
  if (orbit.auto) orbit.angle += dt * 0.12;
  orbit.target.lerp(stageFocus(), 1 - Math.pow(0.0015, dt));
  camera.position.set(
    orbit.target.x + Math.cos(orbit.angle) * orbit.radius,
    orbit.target.y + orbit.height,
    orbit.target.z + Math.sin(orbit.angle) * orbit.radius
  );
  camera.lookAt(orbit.target);
}

function updateFly(dt) {
  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
  const acc = new THREE.Vector3();
  if (keys['KeyW']) acc.add(fwd);
  if (keys['KeyS']) acc.sub(fwd);
  if (keys['KeyD']) acc.add(right);
  if (keys['KeyA']) acc.sub(right);
  if (keys['Space']) acc.y += 1;
  if (keys['KeyC'] || keys['ControlLeft']) acc.y -= 1;
  const boost = keys['ShiftLeft'] || keys['ShiftRight'] ? 4 : 1;
  if (acc.lengthSq() > 0) acc.normalize().multiplyScalar(flySpeed * boost);
  vel.lerp(acc, 1 - Math.pow(0.0001, dt));
  camera.position.addScaledVector(vel, dt);
  camera.position.y = Math.max(camera.position.y, GROUND_Y + 0.35);
  camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
  ui.speedVal.textContent = Math.round(flySpeed * boost);
}

// ---------- input ----------
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyX') toggleXray();
});
addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('click', () => {
  if (!flying) canvas.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
  flying = document.pointerLockElement === canvas;
  ui.crosshair.style.display = flying ? 'block' : 'none';
  ui.speedo.style.display = flying ? 'block' : 'none';
  if (flying) {
    ui.fly.style.opacity = 0;
    // adopt current camera orientation
    const e = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
    yaw = e.y; pitch = e.x;
    vel.set(0, 0, 0);
  }
});
addEventListener('mousemove', e => {
  if (flying) {
    yaw -= e.movementX * 0.0021;
    pitch = Math.max(-1.45, Math.min(1.45, pitch - e.movementY * 0.0021));
  } else if (dragging) {
    orbit.angle += e.movementX * 0.005;
    orbit.height = Math.max(-4, Math.min(60, orbit.height - e.movementY * 0.12));
    orbit.auto = false;
  }
});
let dragging = false;
canvas.addEventListener('mousedown', () => { dragging = true; });
addEventListener('mouseup', () => { dragging = false; });
addEventListener('wheel', e => {
  if (flying) flySpeed = Math.max(1, Math.min(60, flySpeed * (e.deltaY > 0 ? 0.85 : 1.18)));
  else orbit.radius = Math.max(12, Math.min(180, orbit.radius * (e.deltaY > 0 ? 1.08 : 0.93)));
});

// buttons
let xray = false;
function toggleXray() {
  xray = !xray;
  for (const { m, op } of xrayTargets) {
    m.transparent = xray;
    m.opacity = xray ? op : 1;
    m.depthWrite = !xray;
    m.needsUpdate = true;
  }
  document.getElementById('btnXray').classList.toggle('active', xray);
}
document.getElementById('btnXray').addEventListener('click', toggleXray);
document.getElementById('btnSkip').addEventListener('click', finishAssembly);
document.getElementById('btnReplay').addEventListener('click', replayAssembly);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ============================================================
// MAIN LOOP
// ============================================================
// tiny scripting hook (used for automated screenshots / custom camera angles)
let camOverride = null;
window.__a350 = {
  lookFrom: (px, py, pz, tx, ty, tz) => { camOverride = { p: [px, py, pz], t: [tx, ty, tz] }; },
  freeCam: () => { camOverride = null; },
  skip: finishAssembly, replay: replayAssembly, xray: toggleXray,
};

const beaconM = details.userData.beaconM;
const strobe = fin.getObjectByName('strobe');
const clock = new THREE.Clock();
stageT = -0.8; // brief beat before the first part flies in

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (mode === 'assembling') tickAssembly(dt);
  if (camOverride) {
    camera.position.fromArray(camOverride.p);
    camera.lookAt(new THREE.Vector3().fromArray(camOverride.t));
  } else if (flying) updateFly(dt); else updateOrbit(dt);

  // engine fans
  const fanSpd = mode === 'done' ? 7 : 1.4;
  for (const f of fans) f.rotation.z += dt * fanSpd;

  // beacon pulse + strobe double-flash
  if (beaconM) beaconM.emissiveIntensity = 1.2 + 1.6 * Math.max(0, Math.sin(t * 3.5));
  if (strobe) {
    const phase = t % 1.4;
    strobe.material.emissiveIntensity = (phase < 0.07 || (phase > 0.18 && phase < 0.25)) ? 6 : 0.15;
  }

  renderer.render(scene, camera);
}
// initialise all parts at progress 0
for (const p of parts) setPartProgress(p, 0);
animate();
</script>
</body>
</html>
